services:
  app:
    build: .
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      DATABASE_HOST: db
    volumes:
      - .:/app
      - deps:/app/deps
      - build:/app/_build
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:4000/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    stop_grace_period: 60s

  db:
    image: pgvector/pgvector:pg18-trixie
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: disputex_dev
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d disputex_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
    stop_grace_period: 60s

volumes:
  deps:
  build:
  postgres_data:
