name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: disputex
          POSTGRES_PASSWORD: disputex
          POSTGRES_DB: disputex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U disputex -d disputex_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      MIX_ENV: test
      POSTGRES_USER: disputex
      POSTGRES_PASSWORD: disputex
      POSTGRES_HOST: localhost
      POSTGRES_DB: disputex_test

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20.4"
          otp-version: "29.1.2"

      - name: Dependencies
        run: mix deps.get

      - name: Format
        run: mix format --check-formatted

      - name: Credo
        run: mix credo --strict

      - name: Test
        run: mix test

  image:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build the release image
        run: docker build -t disputex:ci .
